<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>preview — 幅指定・並列比較</title>
<style>
  html,body{margin:0;height:100%;background:#2b2f36;color:#ddd;font:13px/1.4 -apple-system,"Hiragino Sans",sans-serif}
  header{position:sticky;top:0;display:flex;gap:12px;align-items:center;padding:8px 12px;background:#1b1e24;border-bottom:1px solid #444;z-index:1;flex-wrap:wrap}
  header a{color:#8cc8ff;text-decoration:none;margin-right:4px}
  header a.on{color:#fff;font-weight:bold;text-decoration:underline}
  main{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:16px;overflow:auto;height:calc(100% - 37px);box-sizing:border-box}
  .pane{display:flex;flex-direction:column;gap:6px}
  .pane .cap{color:#aaa;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  iframe{border:0;background:#fff;box-shadow:0 0 0 1px #555;height:calc(100vh - 90px)}
</style>
</head>
<body>
<header>
  <a href="./">一覧</a>
  <span>幅:</span><span id="widths"></span>
  <span style="margin-left:16px">表示:</span><span id="modes"></span>
  <span style="margin-left:16px">フォント:</span><span id="fonts"></span><span id="fontsb"></span>
  <span style="margin-left:auto;color:#888">?a=top/v01/&amp;b=top/current/&amp;w=390 で指定(b は省略可、URL も可。&amp;h=6000 で全景。&amp;f=zen-new でフォント差し替え、&amp;fb= は右側)</span>
</header>
<main id="main"></main>
<script src="versions.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const w = parseInt(q.get('w') || '390', 10);
  const a = q.get('a') || 'top/current/';
  const b = q.get('b') || null;
  const h = parseInt(q.get('h') || '0', 10); // h を指定すると iframe をその高さで固定し、ページ全体をスクロールして全景を見る
  // フォント差し替え(2026-09-15): f=<key> で左(a)、fb=<key> で右(b。省略時は f と同じ)のページ全体の書体を差し替える。
  // 本番の子テーマ style.css の「* { font-family: 'mdfonticon', -apple-system, … !important }」と同じ形の * ルールを iframe の head 末尾に足して後勝ちさせる
  // (= 本番で子テーマのその 1 行を書き換えたときの見え方。ヘッダー・フッター・タイトル帯・本文すべてに効く)。同一オリジンの iframe だけ(本物の URL には効かない)
  const FONTS = {
    'current':     { label: '現状(OS の書体)', css: null, family: null },
    'zen-new':     { label: 'Zen Kaku Gothic New', css: 'https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap', family: '"Zen Kaku Gothic New"' },
    'zen-antique': { label: 'Zen Kaku Gothic Antique', css: 'https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique:wght@300;400;500;700;900&display=swap', family: '"Zen Kaku Gothic Antique"' },
    'noto':        { label: 'Noto Sans JP', css: 'https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap', family: '"Noto Sans JP"' },
  };
  const f = FONTS[q.get('f')] ? q.get('f') : 'current';
  const fb = FONTS[q.get('fb')] ? q.get('fb') : f;
  const applyFont = (iframe, key) => {
    const ft = FONTS[key]; if (!ft || !ft.family) return;
    let d; try { d = iframe.contentDocument; } catch (e) { return; }
    if (!d || !d.head || d.getElementById('mock-font')) return;
    const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = ft.css; d.head.appendChild(l);
    const st = d.createElement('style'); st.id = 'mock-font';
    st.textContent = `* { font-family: ${ft.family}, 'mdfonticon', -apple-system, 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', '游ゴシック Medium', 'メイリオ', meiryo, sans-serif !important; }`;
    d.head.appendChild(st);
  };
  const pageId = a.split('/')[0];
  const page = (window.MOCK.pages.find(p => p.id === pageId)) || window.MOCK.pages[0];
  const widths = [375, 390, 430, 768, 1024, 1280, 1440];
  const setQ = (k, v) => { const p = new URLSearchParams(location.search); v == null ? p.delete(k) : p.set(k, v); return '?' + p.toString(); };
  document.getElementById('widths').innerHTML = widths.map(x => `<a class="${x===w?'on':''}" href="${setQ('w', x)}">${x}</a>`).join('');
  const modes = [
    ['単体', {a, b: null}],
    ['本物と比較', {a, b: page.live}],
    ['現状と比較', {a, b: `${page.id}/current/`}],
  ];
  document.getElementById('modes').innerHTML = modes.map(([n, m]) => {
    const p = new URLSearchParams(location.search); p.set('a', m.a); m.b ? p.set('b', m.b) : p.delete('b');
    return `<a class="${(m.a===a && (m.b||null)===(b||null))?'on':''}" href="?${p}">${n}</a>`;
  }).join('');
  const fontLinks = (k, cur) => Object.entries(FONTS).map(([key, ft]) => `<a class="${key===cur?'on':''}" href="${setQ(k, key==='current' ? null : key)}">${ft.label}</a>`).join('');
  document.getElementById('fonts').innerHTML = fontLinks('f', f);
  document.getElementById('fontsb').innerHTML = b ? `<span style="margin-left:8px">右:</span>${fontLinks('fb', fb)}` : '';
  const pane = (src, id, key) => `<div class="pane"><div class="cap" style="max-width:${w}px">${src} @ ${w}px${key!=='current' ? ` / ${FONTS[key].label}` : ''}</div><iframe id="${id}" src="${src}" width="${w}"${h ? ` style="height:${h}px"` : ''}></iframe></div>`;
  if (h) { document.getElementById('main').style.height = 'auto'; document.getElementById('main').style.overflow = 'visible'; }
  document.getElementById('main').innerHTML = pane(a, 'pa', f) + (b ? pane(b, 'pb', fb) : '');
  document.getElementById('pa').addEventListener('load', () => applyFont(document.getElementById('pa'), f));
  if (b) document.getElementById('pb').addEventListener('load', () => applyFont(document.getElementById('pb'), fb));
</script>
</body>
</html>
